<form id="formAluno">
    <input type="text" id="nome" placeholder="Nome" required>
    <input type="number" id="idade" placeholder="Idade" required>
    <select id="curso">
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
    </select>
    <input type="number" id="notaFinal" placeholder="Nota Final" step="0.1" required>
    <button type="button" id="btnCadastrar">Cadastrar</button>
</form>

<table id="tabelaAlunos" border="1">
    <thead>
        <tr><th>Nome</th><th>Idade</th><th>Curso</th><th>Nota</th><th>Ações</th></tr>
    </thead>
    <tbody></tbody>
</table>
